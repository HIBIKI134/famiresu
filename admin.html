<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者画面 - メニュー設定 & 注文管理</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        h1, h2 { text-align: center; color: #333; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; width: 100%; box-sizing: border-box; }
        .panel { flex: 1; min-width: 280px; max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box; width: 100%; }
        .menu-list { list-style: none; padding: 0; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .menu-number { background: #666; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        .btn { background: #5cb85c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1em; box-sizing: border-box; }
        .btn-danger { background: #d9534f; width: auto; padding: 4px 8px; font-size: 12px; }
        
        .form-group { margin-bottom: 12px; width: 100%; box-sizing: border-box; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; display: block; }
        
        .hidden { display: none; }
        .order-card { background: #fffde7; border: 1px solid #fff59d; padding: 10px; margin-bottom: 10px; border-radius: 6px; box-sizing: border-box; width: 100%; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        
        .conn-box { background: #e8f5e9; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; box-sizing: border-box; width: 100%; }
        .conn-box textarea { width: 100%; height: 60px; margin-top: 5px; box-sizing: border-box; resize: none; display: block; border: 1px solid #ccc; border-radius: 4px; padding: 5px; }
    </style>
</head>
<body>

    <div id="authLock">
        <h2 style="margin-top: 100px;">🔒 管理者認証</h2>
        <p style="text-align:center;">このページを開くにはパスワードが必要です。</p>
    </div>

    <div id="adminContent" class="hidden">
        <h1>🛠️ 管理者コントロールパネル</h1>

        <!-- 接続エリア -->
        <div class="container">
            <div class="panel conn-box" id="setupArea">
                <h3>🔗 タブレットと直接接続する (ステップ1)</h3>
                <p style="font-size:12px; margin:5px 0;">Chromebook側の「合言葉」を、一旦ここに貼り付けてください</p>
                <textarea id="offerInput" placeholder="ここに貼り付けます"></textarea>
                <button class="btn" style="margin-top:10px;" onclick="acceptOffer()">合言葉を発行する</button>
            </div>
        </div>

        <div class="container">
            <div class="panel" style="border-top: 4px solid #0288d1; max-width: 600px; flex: 2;">
                <h2>📥 受信した注文一覧</h2>
                <div id="orderList"></div>
            </div>

            <div class="panel" style="border-top: 4px solid #d9534f;">
                <h2>✨ 新しいメニューを追加</h2>
                <div class="form-group"><label>商品番号:</label><input type="number" id="menuId"></div>
                <div class="form-group"><label>メニュー名:</label><input type="text" id="menuName"></div>
                <div class="form-group"><label>価格 (円):</label><input type="number" id="menuPrice"></div>
                <button class="btn" onclick="addMenu()">メニューを登録する</button>

                <h2 style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">📋 登録中のメニュー</h2>
                <ul id="adminMenuList" class="menu-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "0404";
        let menus = JSON.parse(localStorage.getItem('famires_menus')) || [];
        let orders = JSON.parse(localStorage.getItem('famires_orders')) || [];
        let peerConnection;
        let remoteChannel;

        function checkPassword() {
            const input = prompt('管理者パスワードを入力してください:');
            if (input === ADMIN_PASSWORD) {
                document.getElementById('authLock').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                updateAdminDisplay();
                updateOrderDisplay();
            } else {
                alert('パスワードが違います。');
                window.location.reload();
            }
        }

        const config = { iceServers: [] };

        function acceptOffer() {
            const offerText = document.getElementById('offerInput').value.trim();
            if(!offerText) return alert("文字列を入力してください");

            try {
                const offer = JSON.parse(decodeURIComponent(escape(atob(offerText))));
                peerConnection = new RTCPeerConnection(config);

                peerConnection.onicecandidate = (e) => {
                    if (!e.candidate) {
                        const localAnswerB64 = btoa(unescape(encodeURIComponent(JSON.stringify(peerConnection.localDescription))));
                        document.getElementById('setupArea').innerHTML = `
                            <h3>🔗 接続の最終ステップ</h3>
                            <p style="font-size:12px; color:green; font-weight:bold;">下の文字列をすべてコピーして、Chromebook側に貼り付けて確定してください</p>
                            <textarea id="localAnswer" readonly>${localAnswerB64}</textarea>
                            <button class="btn" style="margin-top:10px; background:#4cae4c;" onclick="document.getElementById('localAnswer').select(); document.execCommand('copy'); alert('コピーしました！');">コピーする</button>
                        `;
                    }
                };

                peerConnection.ondatachannel = (e) => {
                    remoteChannel = e.channel;
                    remoteChannel.onopen = () => {
                        document.getElementById('setupArea').innerHTML = "<h3 style='color:green; margin:0;'>✅ タブレットと接続完了！</h3>";
                        syncMenusToCustomer();
                    };
                    remoteChannel.onmessage = (evt) => {
                        const data = JSON.parse(evt.data);
                        if (data.type === "newOrder") {
                            orders.push(data.order);
                            localStorage.setItem('famires_orders', JSON.stringify(orders));
                            updateOrderDisplay();
                        }
                    };
                };

                peerConnection.setRemoteDescription(new RTCSessionDescription(offer))
                    .then(() => peerConnection.createAnswer())
                    .then(answer => peerConnection.setLocalDescription(answer));

            } catch(err) {
                alert("正しく読み込めませんでした。");
            }
        }

        function syncMenusToCustomer() {
            if (remoteChannel && remoteChannel.readyState === "open") {
                remoteChannel.send(JSON.stringify({ type: "syncMenus", menus: menus }));
            }
        }

        function updateAdminDisplay() {
            menus.sort((a, b) => a.id - b.id);
            const ul = document.getElementById('adminMenuList');
            ul.innerHTML = '';
            menus.forEach(item => {
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.innerHTML = `<div><span class="menu-number">${item.id}</span><strong>${item.name}</strong> - ${item.price}円</div><button class="btn btn-danger" onclick="deleteMenu(${item.id})">削除</button>`;
                ul.appendChild(li);
            });
        }

        function updateOrderDisplay() {
            const orderListDiv = document.getElementById('orderList');
            orderListDiv.innerHTML = '';
            if (orders.length === 0) {
                orderListDiv.innerHTML = '<div style="text-align:center; color:#777; padding:20px;">現在、新しい注文はありません。</div>';
                return;
            }
            for (let i = orders.length - 1; i >= 0; i--) {
                const order = orders[i];
                const card = document.createElement('div');
                card.className = 'order-card';
                const itemCounts = {};
                order.items.forEach(item => {
                    itemCounts[item.id] = itemCounts[item.id] ? { name: item.name, count: itemCounts[item.id].count + 1 } : { name: item.name, count: 1 };
                });
                let itemsHtml = '<ul>';
                for (const id in itemCounts) { itemsHtml += `<li>【${id}】 <strong>${itemCounts[id].name}</strong> - <span style="color:#d9534f; font-weight:bold;">${itemCounts[id].count}点</span></li>`; }
                itemsHtml += '</ul>';

                card.innerHTML = `<div class="order-header"><span>⏰ 注文時刻: ${order.time}</span><span style="color:#d9534f;">状態: ${order.status}</span></div><div style="padding: 10px 0;">${itemsHtml}</div><div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #eee; padding-top:5px;"><span>合計金額: <strong>${order.total}円</strong></span><button class="btn" style="width:120px; padding:5px; background:#0288d1;" onclick="completeOrder(${order.id})">配膳完了 / 消去</button></div>`;
                orderListDiv.appendChild(card);
            }
        }

        function completeOrder(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('famires_orders', JSON.stringify(orders));
            updateOrderDisplay();
        }
        function addMenu() {
    const idInput = 
        document.getElementById('menuId');
    const nameInput = 
        document.getElementById('menuName');
    const priceInput = 
        document.getElementById('menuPrice');

    const id = parseInt(idInput.value);
    const name = nameInput.value.trim();
    const price = parseInt(priceInput.value);

    if (!id || !name || !price) {
        alert('入力が正しくありません。');
        return;
    }

    if (menus.some(m => m.id === id)) {
        alert(`商品番号 ${id} 番は登録済みです。`);
        return;
    }

    menus.push({ id, name, price });
    localStorage.setItem(
        'famires_menus', 
        JSON.stringify(menus)
    );

    idInput.value = '';
    nameInput.value = '';
    priceInput.value = '';

    updateAdminDisplay();
    syncMenusToCustomer();
}

function deleteMenu(id) {
    if (confirm(
        `商品番号 ${id} 番のメニューを削除しますか？`
    )) {
        menus = menus.filter(
            m => m.id !== id
        );
        localStorage.setItem(
            'famires_menus', 
            JSON.stringify(menus)
        );
        updateAdminDisplay();
        syncMenusToCustomer();
    }
}

checkPassword();
    </script>
</body>
</html>


        function addMenu() {
            const idInput = document.getElementById('menuId');
