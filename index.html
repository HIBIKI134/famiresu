<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文システム</title>
    <!-- QRコード解析用ライブラリを読み込み -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        h1, h2 { text-align: center; color: #d9534f; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .panel { flex: 1; min-width: 300px; max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-list { list-style: none; padding: 0; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .menu-number { background: #d9534f; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        .btn { background: #5cb85c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #4cae4c; }
        .empty-message { text-align: center; color: #777; padding: 20px; }
        .cart { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 6px; }
        
        /* QRスキャン用のスタイル */
        .scan-box { background: #e3f2fd; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
        #video { width: 100%; max-width: 300px; border-radius: 6px; transform: scaleX(-1); background: #222; }
    </style>
</head>
<body>

    <h1>注文タブレット</h1>

    <div class="container">
        <!-- カメラ接続エリア -->
        <div class="panel scan-box" id="setupArea">
            <h3>🔗 スマホと直接接続する</h3>
            <p style="font-size:12px; margin:5px 0;">スマホ画面のQRコードをインカメラに映してください</p>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <h2>メニュー一覧</h2>
            <ul id="menuList" class="menu-list"></ul>

            <div class="cart">
                <h3>🛒 注文カート</h3>
                <ul id="cartList" style="padding-left: 20px;"></ul>
                <p style="font-size: 1.2em; font-weight: bold; text-align: right;">合計金額: <span id="totalPrice">0</span>円</p>
                <button class="btn" style="width: 100%; padding: 10px; font-size: 1.1em;" onclick="submitOrder()">注文を確定する</button>
            </div>
        </div>
    </div>

    <script>
        let menus = JSON.parse(localStorage.getItem('famires_menus')) || [];
        let cart = [];
        let peerConnection;
        let dataChannel;

        // --- WebRTC接続処理（カメラQR読み取り） ---
        const config = { iceServers: [{ urls: "stun:://google.com" }] };
        
        function initWebRTC() {
            peerConnection = new RTCPeerConnection(config);
            
            dataChannel = peerConnection.createDataChannel("orderChannel");
            dataChannel.onopen = () => {
                document.getElementById('setupArea').innerHTML = "<h3 style='color:green; margin:0;'>✅ スマホと接続完了！</h3>";
                if(videoStream) videoStream.getTracks().forEach(track => track.stop());
            };
            dataChannel.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === "syncMenus") {
                    menus = data.menus;
                    localStorage.setItem('famires_menus', JSON.stringify(menus));
                    updateDisplay();
                }
            };

            peerConnection.createOffer().then(offer => peerConnection.setLocalDescription(offer));
        }

        // カメラ起動とQR解析
        let videoStream;
        function startCamera() {
            const video = document.getElementById("video");
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(stream => {
                videoStream = stream;
                video.srcObject = stream;
                
                function scan() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.height = video.videoHeight;
                        canvas.width = video.videoWidth;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            try {
                                const answer = JSON.parse(atob(code.data));
                                peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                                return; // スキャン成功で終了
                            } catch(e) {}
                        }
                    }
                    requestAnimationFrame(scan);
                }
                requestAnimationFrame(scan);
            });
        }

        // --- 画面表示と注文処理 ---
        function updateDisplay() {
            menus.sort((a, b) => a.id - b.id);
            const menuListUl = document.getElementById('menuList');
            menuListUl.innerHTML = '';
            
            if (menus.length === 0) {
                menuListUl.innerHTML = '<div class="empty-message">メニューが登録されていません。</div>';
            } else {
                menus.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'menu-item';
                    li.innerHTML = `
                        <div><span class="menu-number">${item.id}</span><strong>${item.name}</strong> - ${item.price}円</div>
                        <button class="btn" onclick="addToCart(${item.id})">注文</button>
                    `;
                    menuListUl.appendChild(li);
                });
            }

            const cartListUl = document.getElementById('cartList');
            cartListUl.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.style.marginBottom = '5px';
                li.innerHTML = `【${item.id}】 ${item.name} (${item.price}円) <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">[取消]</button>`;
                cartListUl.appendChild(li);
                total += item.price;
            });

            document.getElementById('totalPrice').innerText = total;
        }

        function addToCart(id) {
            const item = menus.find(m => m.id === id);
            if (item) { cart.push(item); updateDisplay(); }
        }

        function removeFromCart(index) {
            cart.splice(index, 1); updateDisplay();
        }

        function submitOrder() {
            if (cart.length === 0) return alert('カートに商品が入っていません。');
            if (!dataChannel || dataChannel.readyState !== "open") return alert("スマホと接続されていません。");

            const newOrder = {
                id: Date.now(),
                time: new Date().toLocaleTimeString(),
                items: [...cart],
                total: cart.reduce((sum, item) => sum + item.price, 0),
                status: '未対応'
            };

            dataChannel.send(JSON.stringify({ type: "newOrder", order: newOrder }));
            alert('注文が完了しました！');
            cart = [];
            updateDisplay();
        }

        initWebRTC();
        startCamera();
        updateDisplay();
    </script>
</body>
</html>
